<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- PWA essentials -->
    <meta name="theme-color" content="#0f1a10" />
    <meta name="description" content="SwachhMap — Clean India, One Report at a Time" />

    <!-- Open Graph — looks great when shared on LinkedIn/WhatsApp -->
    <meta property="og:title" content="🌿 SwachhMap — Clean India, One Report at a Time" />
    <meta property="og:description" content="Photograph litter near you, earn points, and help municipalities clean up India. Join the movement." />
    <meta property="og:url" content="https://swachhmap.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🌿 SwachhMap" />
    <meta name="twitter:description" content="Report litter. Earn points. Clean India." />

    <title>🌿 SwachhMap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f1a10; }
    #root { min-height: 100%; display: flex; flex-direction: column; }
  </style>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>

    <!--
      Vite replaces this with the compiled bundle on build.
      During dev, it serves src/main.jsx directly with hot reload.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
